setInterval(()=>{if(!LOGGED||VIS)return;if(F>0)S.g.n.f=1;ACH.forEach(a=>{if(!S.g.ach[a[0]]&&a[3]()){S.g.ach[a[0]]=1;const r=Math.round(Math.max(300,income()*120));S.cash+=r;note('🏅 '+a[2]+' · +₪'+fs(r));sfx.up();saveNow()}})},1000);
// tutorial
const TUT=['עמוד על המשטח הזהב כדי לאסוף כסף 💰','עמוד על המשטח הלבן כדי לשדרג את האזור ⬆','עמוד על המשטח הטורקיז כדי לשכור עובד שעובד לבד 👷','כשיש כסף – עלה במעלית לקומה הבאה 🛗'];
setInterval(()=>{const el=$('tut');if(!LOGGED||VIS||S.g.tut>=4){el.style.display='none';return}const d=[()=>S.g.n.c>=1,()=>S.g.n.u>=1,()=>S.g.n.h>=1,()=>S.g.n.f>=1];while(S.g.tut<4&&d[S.g.tut]())S.g.tut++;if(S.g.tut>=4){el.style.display='none';saveNow();return}el.textContent=TUT[S.g.tut];el.style.display='block'},600);
// themes
const THEMES=[['☀ יום',0x39c6d6,0xfff0d6,2.2,1.2,1.2],['🌅 שקיעה',0xf6916b,0xffb36b,1.8,1.1,.9],['🌙 לילה',0x101a40,0x9fb4ff,.9,.9,.55],['🌴 טרופי',0x4fe0c0,0xffffff,2.4,1.25,1.3]];
function applyTheme(){const t=THEMES[S.g.th||0];scene.background.set(t[1]);sun.color.set(t[2]);sun.intensity=t[3];R.toneMappingExposure=t[4];HEM.intensity=t[5]}
// prestige
let PCONF=0;const prC=()=>Math.round(Math.max(1e6,income()*36000)*Math.pow(2,S.g.pr)),canPr=()=>S.fl[2]&&OP()>=15&&S.cash>=prC();
function doPrestige(){S.cash-=prC();S.g.pr++;PCONF=0;saveNow();sfx.up();note('👑 שיפוץ יוקרה! הכנסה x'+PM().toFixed(1))}
// level
const xpv=()=>S.g.n.c+4*S.g.n.u+8*S.g.n.h+15*Object.keys(S.g.ach).length+25*S.g.pr+3*S.g.gifts+10*Math.floor(Math.log10(S.g.te+1));
const lvl=()=>Math.floor(Math.sqrt(xpv()/6))+1;
const title=l=>l<5?'מנהל מתחיל':l<10?'מנהל':l<15?'מנהל בכיר':l<20?'מגנט':'אגדה';
setInterval(()=>{if(!LOGGED||VIS)return;const l=lvl();if(l>S.g.lv){if(S.g.lv>0){const r=Math.round(Math.max(500,income()*200));S.cash+=r;note('🎖 רמה '+l+' · '+title(l)+' · +₪'+fs(r));sfx.up()}S.g.lv=l;saveNow()}
 const t='רמה '+l+' · '+NAME;setLabel(MYLB,t,'#0b1020cc','#ffd86b');$('afk').style.display=(LOGGED&&!VIS&&AFK()<1)?'block':'none';const sl=$('slv');if(sl)sl.textContent='🎖 רמה '+l},1000);
// menu
let MT=0;
function renderMenu(){const b=$('mbody');b.innerHTML='';[0,1,2,3].forEach(i=>{const t=$('mt'+i);t.style.background=MT===i?'#ffd86b':'#3a4468';t.style.color=MT===i?'#14193a':'#c9cfe0'});
 const row=(h,c)=>{const d=document.createElement('div');d.style.cssText='display:flex;align-items:center;gap:8px;background:#ffffff14;border-radius:14px;padding:10px 12px;margin-bottom:6px;font:700 14px Heebo;color:'+(c||'#fff');d.innerHTML=h;b.appendChild(d);return d};
 if(MT===0){const n=ACH.filter(a=>S.g.ach[a[0]]).length;row('הישגים: '+n+' / '+ACH.length,'#ffd86b');ACH.forEach(a=>{const ok=S.g.ach[a[0]];row('<span style="font-size:20px">'+(ok?a[1]:'🔒')+'</span><span style="flex:1">'+a[2]+'</span>'+(ok?'<span style="color:#2fe38a">✓</span>':''),ok?'#fff':'#8b90a3')})}
 else if(MT===1){row('כפל הכנסה נוכחי: x'+PM().toFixed(1)+' · שיפוץ #'+S.g.pr,'#ffd86b');row('שיפוץ יוקרה: משלמים סכום גדול והמלון נהיה מפואר יותר – כל ההכנסות +50% לצמיתות. שום דבר לא מתאפס: רמות, אזורים וכסף נשארים. מחיר: ₪'+fs(prC())+'. דרוש: קומה 3 + 15 אזורים.','#c9cfe0');const bt=document.createElement('button');bt.style.cssText='width:100%;border:0;border-radius:14px;padding:14px;font:800 16px Heebo;margin-top:6px;background:'+(canPr()?'#ffd86b':'#3a4468')+';color:'+(canPr()?'#14193a':'#8b90a3');bt.textContent=!canPr()?'עדיין לא מוכן (קומה 3 + 15 אזורים + ₪'+fs(prC())+')':PCONF?'לחץ שוב לאישור':'👑 שיפוץ יוקרה';bt.onclick=()=>{if(!canPr()||VIS)return;if(!PCONF){PCONF=1;setTimeout(()=>{PCONF=0;if($('mpanel').style.display==='block')renderMenu()},4000);renderMenu()}else{doPrestige();$('mpanel').style.display='none'}};b.appendChild(bt)}
 else if(MT===3){const l=lvl(),nx=Math.ceil(Math.pow(l,2)*6),pv=Math.pow(l-1,2)*6,pc=Math.max(0,Math.min(100,(xpv()-pv)/(nx-pv)*100)),hn=S.rm.filter(r=>r.h).length;
  row('<span style="font-size:26px">🎖</span><span style="flex:1"><b style="color:#ffd86b;font-size:17px">רמה '+l+' · '+title(l)+'</b><div style="height:8px;background:#ffffff22;border-radius:6px;margin-top:6px"><div style="height:8px;width:'+pc+'%;background:#ffd86b;border-radius:6px"></div></div></span>');
  const ST=[['💰 סה"כ הרווחת','₪'+fs(S.g.te)],['📈 הכנסה לשנייה','₪'+fs(income())],['⏱ זמן משחק',Math.floor(S.g.pt/3600)+'ש׳ '+Math.floor(S.g.pt/60%60)+'ד׳'],['🏨 אזורים פתוחים',OP()+' / '+S.rm.length],['👷 עובדים',hn+' / '+S.rm.length],['⬆ שדרוגים',S.g.n.u],['🪙 טיפים','₪'+fs(S.g.tips)],['🎁 מתנות שנתת',S.g.gifts],['🏅 הישגים',ACH.filter(a=>S.g.ach[a[0]]).length+' / '+ACH.length],['👑 שיפוצים',S.g.pr+' (x'+PM().toFixed(1)+')'],['😴 מצב AFK',AFK()<1?'פעיל – הכנסה 20%':'לא']];ST.forEach(x=>row('<span style="flex:1">'+x[0]+'</span><b style="color:#ffd86b">'+x[1]+'</b>'))}
 else{THEMES.forEach((t,i)=>{const d=row('<span style="flex:1">'+t[0]+'</span>'+((S.g.th||0)===i?'<span style="color:#2fe38a">✓</span>':''),'#fff');d.style.cursor='pointer';d.onclick=()=>{S.g.th=i;applyTheme();saveNow();renderMenu()}})}}
$('mbtn').onclick=()=>{renderMenu();$('mpanel').style.display='block'};$('mclose').onclick=()=>$('mpanel').style.display='none';[0,1,2,3].forEach(i=>$('mt'+i).onclick=()=>{MT=i;renderMenu()});
// events
let NEV=Date.now()+60000;
setInterval(()=>{if(!LOGGED||VIS||S.g.tut<4||Date.now()<NEV)return;NEV=Date.now()+(100+Math.random()*80)*1000;const k='ev'+Date.now(),I=()=>income(),n=Date.now(),E=[
 ['🎩 אורח VIP הגיע! לארח אותו בכבוד?',()=>{const a=Math.round(I()*40);S.cash+=a;S.g.bEnd=Math.max(S.g.bEnd,n+6e4);S.g.bM=Math.max(Date.now()<S.g.bEnd?S.g.bM:1,3);note('🎩 VIP שילם ₪'+fs(a)+' · טיפים x3');sfx.ding()}],
 ['💒 חתונה באולם! לארח אותה?',()=>{const a=Math.round(I()*70);S.cash+=a;note('💒 החתונה הכניסה ₪'+fs(a));sfx.ding()}],
 ['⭐ מבקר מישלן הגיע! להרשים אותו (עולה ₪'+fs(Math.round(I()*20))+')?',()=>{const c=Math.round(I()*20);if(S.cash<c){note('אין מספיק כסף');return}S.cash-=c;const a=Math.round(I()*150);S.cash+=a;note('⭐ ביקורת מעולה! +₪'+fs(a));sfx.up()}]],e=E[Math.floor(Math.random()*E.length)];toast(k,e[0],e[1],null)},5000);
buildTabs();setInterval(hud,200);setTimeout(()=>{const h=$('hint');if(h)h.style.display='none'},8000);hud();loop();window.ready=true;
